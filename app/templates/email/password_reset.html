<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body style="font-family: Arial, sans-serif; padding: 20px;">
        <h2>Password Reset</h2>
        <p>You requested a password reset. Please use the following token to reset it:</p>
        <div style="background-color: #f4f4f4; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p style="font-size: 16px; font-weight: bold;">{{token}}</p>
        </div>
        <p>Or use this endpoint directly in API: <br> <code>{{reset_url}}</code></p>
        <p>If you did not request this, please ignore this email.</p>
    </body>
</html>

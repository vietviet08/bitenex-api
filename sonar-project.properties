sonar.projectKey=bitenex-api
sonar.projectName=Bitenex API
sonar.sourceEncoding=UTF-8

sonar.sources=app
sonar.tests=app/tests
sonar.test.inclusions=app/tests/**/*.py

sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.ruff_cache/**,**/.venv/**,**/venv/**,alembic/**,docs/**,scripts/**
sonar.coverage.exclusions=app/tests/**,alembic/**,docs/**,scripts/**

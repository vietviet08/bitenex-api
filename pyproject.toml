[project]
name = "bitenex-api"
version = "0.1.1"
description = "Production-grade FastAPI backend for Bitenex food delivery platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "app.tests.*"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pylint.MESSAGES_CONTROL]
disable = ["E1102"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app"]
omit = [
    "app/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
skip_covered = false
show_missing = true

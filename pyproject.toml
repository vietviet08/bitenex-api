[project]
name = "bitenex-api"
version = "0.1.0"
description = "Production-grade FastAPI backend for Bitenex food delivery platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

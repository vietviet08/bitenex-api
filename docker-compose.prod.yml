services:
  api:
    image: ${API_IMAGE:-bitenex-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bitenex-api
    restart: always
    env_file:
      - .env
    volumes:
      - ./bitenex-89b3e-firebase-adminsdk-fbsvc-34dbe96019.json:/app/firebase-credentials.json:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bitenex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: bitenex-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - bitenex-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    container_name: bitenex-n8n
    restart: always
    env_file:
      - .env.docker
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - bitenex-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: bitenex-pgadmin
    restart: always
    env_file:
      - .env.docker
    ports:
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./deploy/pgadmin/pgpassfile:/pgpassfile:ro
    networks:
      - bitenex-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bitenex-network:
    driver: bridge
    name: bitenex-network

volumes:
  redis_data:
    name: bitenex-redis-data
  n8n_data:
    name: bitenex-n8n-data
  pgadmin_data:
    name: bitenex-pgadmin-data

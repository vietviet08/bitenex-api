repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
        files: ^app/

  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        files: ^app/

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        files: ^app/
